<style>

margin:0;

<body>

<header>
<h1>SNOWWHITE7sigmas</h1>
<div class="subtitle">Videos sedan 19 augusti 2025</div>
</header>

<div class="section">
    <h2>Jourtelefon schema</h2>
    <p>Idag: <span id="current-date" style="font-weight:bold; color:#fffa00;"></span></p>
    <p>Telefonnummer: XXX XXX XX XX</p>

    <!-- Scrollbar container -->
    <div style="max-height: 300px; overflow-y: auto; border: 2px solid #ff7ac8; border-radius: 10px;">
        <table class="table" id="schedule-table" style="margin-top:0;">
            <thead>
                <tr style="position: sticky; top: 0; z-index: 1;">
                    <th>Datum (Mån-Sön)</th>
                    <th>Vecka</th>
                    <th>Ansvarig</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
                <!-- Raderna skapas automatiskt av JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function generateSchedule() {
        const scheduleBody = document.getElementById('schedule-body');
        const currentDateSpan = document.getElementById('current-date');
        
        // Inställningar
        const staff = ["Tobbe", "Veronica", "Kenya"];
        const startDate = new Date('2025-08-18'); // En måndag som referens för rotationen
        const now = new Date();
        
        // Visa dagens datum snyggt
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        currentDateSpan.innerText = now.toLocaleDateString('sv-SE', options);

        // Hitta måndagen i den här veckan
        let currentMonday = new Date(now);
        currentMonday.setDate(now.getDate() - (now.getDay() === 0 ? 6 : now.getDay() - 1));
        currentMonday.setHours(0, 0, 0, 0);

        // Skapa rader för 52 veckor framåt
        for (let i = 0; i < 52; i++) {
            let weekStart = new Date(currentMonday);
            weekStart.setDate(currentMonday.getDate() + (i * 7));
            
            let weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);

            // Beräkna vem som har jour baserat på rotation från startdatumet
            const weeksSinceStart = Math.floor((weekStart - startDate) / (7 * 24 * 60 * 60 * 1000));
            const personIndex = ((weeksSinceStart % staff.length) + staff.length) % staff.length;
            const person = staff[personIndex];

            // Hämta veckonummer
            const weekNum = getWeekNumber(weekStart);

            // Skapa raden
            const row = document.createElement('tr');
            if (i === 0) row.style.background = "rgba(255, 250, 0, 0.2)"; // Markera denna vecka
            
            row.innerHTML = `
                <td>${weekStart.toLocaleDateString('sv-SE', {month:'short', day:'numeric'})} - ${weekEnd.toLocaleDateString('sv-SE', {month:'short', day:'numeric'})}</td>
                <td>v.${weekNum}</td>
                <td style="${i === 0 ? 'font-weight:bold; color:#fffa00;' : ''}">${person}</td>
            `;
            scheduleBody.appendChild(row);
        }
    }

    // Funktion för att få korrekt veckonummer enligt ISO (svensk standard)
    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return weekNo;
    }

    // Kör funktionen när sidan laddas
    window.onload = generateSchedule;
</script>
